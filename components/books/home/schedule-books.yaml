---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/refs/heads/main/schema/k8up.io/schedule_v1.json
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: schedule-kavita-config-pvc
  namespace: books
spec:
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  backup:
    schedule: "30 2,14 * * *"
    clusterName: kavita-config-pvc
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 3
    podConfigRef:
      name: backup-exclude-lost-found
    labelSelectors:
      - matchLabels:
          k8up.io/backup-schedule: kavita-config
  prune:
    schedule: "0 3 * * 6"
    retention:
      keepHourly: 4
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 3
  check:
    schedule: "15 3 * * 6"
    clusterName: kavita-config-pvc
  backend:
    repoPasswordSecretRef:
      name: ovhcloud-k8up-home-s3
      key: RESTIC_PASSWORD
    s3:
      endpoint: https://s3.de.io.cloud.ovh.net
      bucket: k8up-home-a58c5097c4/books/kavita-config-pvc
      accessKeyIDSecretRef:
        name: ovhcloud-k8up-home-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKeySecretRef:
        name: ovhcloud-k8up-home-s3
        key: AWS_SECRET_ACCESS_KEY
