---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/refs/heads/main/schema/onepassword.com/onepassworditem_v1.json
# Not named "paperless-ngx": the apps ResourceSet substitutes variables from a
# Secret of that exact name, and these keys contain hyphens, which envsubst
# rejects as variable names. Naming it that breaks the whole Kustomization.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: paperless-ngx-secrets
  namespace: paperless-ngx
spec:
  itemPath: "vaults/4kbytax7eoweefgrkbg2af6oxu/items/dlarq3noet3irxouw3ggl5dysq"
