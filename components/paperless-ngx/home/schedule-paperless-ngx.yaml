---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/refs/heads/main/schema/k8up.io/schedule_v1.json
#
# One run covers both halves of a restore: the media volume, matched by label,
# and a database dump triggered by annotations on the database pod. Everything
# else either rebuilds itself or is temporary. Times are offset from the books
# schedule so the two do not overlap.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: schedule-paperless-ngx
  namespace: paperless-ngx
spec:
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  backup:
    schedule: "15 3,15 * * *"
    clusterName: paperless-ngx
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 3
    podConfigRef:
      name: backup-exclude-lost-found
    labelSelectors:
      - matchLabels:
          k8up.io/backup-schedule: paperless-ngx
  prune:
    schedule: "0 4 * * 6"
    retention:
      keepHourly: 4
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 3
  check:
    schedule: "15 4 * * 6"
    clusterName: paperless-ngx
  backend:
    repoPasswordSecretRef:
      name: ovhcloud-k8up-home-s3
      key: RESTIC_PASSWORD
    s3:
      endpoint: https://s3.de.io.cloud.ovh.net
      bucket: k8up-home-a58c5097c4/paperless-ngx
      accessKeyIDSecretRef:
        name: ovhcloud-k8up-home-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKeySecretRef:
        name: ovhcloud-k8up-home-s3
        key: AWS_SECRET_ACCESS_KEY
