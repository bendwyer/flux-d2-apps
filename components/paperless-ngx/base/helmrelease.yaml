---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: bjw-s
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [1000]
        seccompProfile:
          type: RuntimeDefault
    controllers:
      paperless-ngx:
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: "3.1.1@sha256:73a1d0bcc5b50cb501f084da795722aa5e2988c6bc9b26ca1ae493a57a490c06"
              pullPolicy: IfNotPresent
            env:
              # The chart sorts env vars by name, so this is set before
              # PAPERLESS_REDIS uses it below. Same secret the Dragonfly
              # instance uses, so the password is only written down once.
              BROKER_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-secrets
                    key: broker-password
              PAPERLESS_REDIS: redis://:$(BROKER_PASSWORD)@paperless-ngx-cache.paperless-ngx.svc.cluster.local:6379

              # Connection details come from the secret CNPG generates, so
              # none of them are hardcoded here.
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-db-app
                    key: host
              PAPERLESS_DBPORT:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-db-app
                    key: port
              PAPERLESS_DBNAME:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-db-app
                    key: dbname
              PAPERLESS_DBUSER:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-db-app
                    key: username
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-db-app
                    key: password

              # Also sets the allowed hosts, CORS and CSRF origins.
              PAPERLESS_URL: https://paperless.tail0c49c.ts.net
              PAPERLESS_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-secrets
                    key: secret-key

              # Local admin, created on first start. Kept alongside SSO so a
              # tsidp outage cannot lock you out.
              PAPERLESS_ADMIN_USER:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-admin
                    key: username
              PAPERLESS_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-admin
                    key: password

              # SSO via tsidp. Paperless wants the whole provider config as one
              # JSON value, so it is written out here and the two credentials
              # are filled in from the secret at startup. Both OIDC_ vars sort
              # ahead of PAPERLESS_, so the references resolve.
              #
              # provider_id must stay "tsidp": it forms the callback path
              # /accounts/oidc/tsidp/login/callback/ registered in tsidp.
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-oidc
                    key: client_id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-oidc
                    key: client_secret
              PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"APPS":[{"provider_id":"tsidp","name":"Tailscale","client_id":"$(OIDC_CLIENT_ID)","secret":"$(OIDC_CLIENT_SECRET)","settings":{"server_url":"https://idp.tail0c49c.ts.net"}}],"SCOPE":["openid","profile","email"]}}'
              PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
              PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: https

              # Document conversion for Office formats and email.
              PAPERLESS_TIKA_ENABLED: "true"
              PAPERLESS_TIKA_ENDPOINT: http://paperless-ngx-tika:9998
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-ngx-gotenberg:3000

              PAPERLESS_OCR_LANGUAGE: eng+deu+jpn+spa
              PAPERLESS_OCR_LANGUAGES: jpn script-jpan script-jpan-vert

              # Day-first for ambiguous dates like 03/04/2026. Currently also
              # the upstream default; pinned so it cannot drift.
              PAPERLESS_DATE_ORDER: DMY

              PAPERLESS_WORKER_TIMEOUT: "3600"
              PAPERLESS_TIME_ZONE: Europe/Berlin
            resources:
              limits:
                # One page buffer per OCR thread, so eight in flight here.
                memory: 6Gi
              requests:
                cpu: 2000m
                memory: 6Gi
        revisionHistoryLimit: 3

      tika:
        containers:
          app:
            image:
              repository: docker.io/apache/tika
              tag: "3.3.1.0-full@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470"
              pullPolicy: IfNotPresent
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        revisionHistoryLimit: 3

      gotenberg:
        containers:
          app:
            image:
              repository: docker.io/gotenberg/gotenberg
              tag: "8.36@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466"
              pullPolicy: IfNotPresent
            # Only ever renders files paperless hands it, so JavaScript is
            # off and it can only read from /tmp.
            command:
              - gotenberg
              - --chromium-disable-javascript=true
              - --chromium-allow-list=file:///tmp/.*
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsUser: 1001
              capabilities:
                drop: [ALL]
        revisionHistoryLimit: 3

    service:
      paperless-ngx:
        controller: paperless-ngx
        ports:
          http:
            port: 8000
      tika:
        controller: tika
        ports:
          http:
            port: 9998
      gotenberg:
        controller: gotenberg
        ports:
          http:
            port: 3000

    persistence:
      data:
        existingClaim: paperless-ngx-data
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/data
      media:
        existingClaim: paperless-ngx-media
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/media
      consume:
        existingClaim: paperless-ngx-consume
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/consume
      export:
        existingClaim: paperless-ngx-export
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/export
      tmp:
        type: emptyDir
        advancedMounts:
          paperless-ngx:
            app:
              - path: /tmp
          tika:
            app:
              - path: /tmp
          gotenberg:
            app:
              - path: /tmp
