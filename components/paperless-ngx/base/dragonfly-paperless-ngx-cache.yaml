---
# Task queue for paperless. Nothing in here is worth keeping, so there is no
# snapshot: a restart loses queued OCR jobs and they get picked up again.
# The password comes from the same secret paperless reads, so it is only
# written down once.
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: paperless-ngx-cache
  namespace: paperless-ngx
spec:
  replicas: 1
  # Dragonfly runs one IO thread per core and needs 256Mi per thread, so it
  # would demand 2.5Gi on an eight core node. One thread is ample for this.
  args:
    - --proactor_threads=1
  authentication:
    passwordFromSecret:
      name: paperless-ngx-secrets
      key: broker-password
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 512Mi
