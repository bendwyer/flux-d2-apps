---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim-updater
  namespace: valheim
data:
  update.sh: |
    #!/usr/bin/env sh
    # Restarts the server when a restart is the only fix for what it is
    # serving: a newer Steam build, or a WAN address it no longer has.
    #
    # Clients auto-update and the server cannot, so a server left behind stops
    # accepting connections entirely. Nothing here pins a version: the
    # container fetches the current build on every start, so any restart is
    # also the update.
    #
    # The server looks its public address up once per process and registers
    # its lobby under it, and joining by address searches for exactly that
    # value. After the WAN address changes, even the server's own PlayFab
    # reconnect re-registers the stale one, so address joins find nothing
    # until the process restarts. Join codes are unaffected.
    #
    # Two schedules share this script. The frequent one waits for a new build
    # until the server has been empty for MIN_EMPTY_SECONDS, so an update
    # never interrupts anyone. The daily one sets FORCE_RESTART and goes
    # regardless, which is what stops a permanently occupied server holding a
    # stale build hostage: the players keeping it busy are on old clients that
    # still work, while everyone who has updated cannot get in to displace
    # them. An address change restarts at once on either schedule, because the
    # outage behind it has already dropped every player.
    set -eu

    steam_app=896660
    steam_depot=896661
    # The chart names the container after its key in the values.
    container=app
    # Required, not defaulted: a missing value must fail loudly rather than
    # quietly target the wrong world.
    deploy=${VALHEIM_DEPLOYMENT:?VALHEIM_DEPLOYMENT must be set}
    state=${STATE_CONFIGMAP:?STATE_CONFIGMAP must be set}
    force=${FORCE_RESTART:-false}
    min_empty=${MIN_EMPTY_SECONDS:-1800}
    # Covers world load and PlayFab registration, and stops a server that
    # crashes on start from being restarted on every run.
    min_uptime=600
    # The server logs its connection count every 600s.
    max_count_age=900

    now=$(date +%s)
    log=/tmp/server.log

    epoch() {
      jq -rn --arg t "$1" '$t | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601'
    }

    is_ipv4() {
      printf '%s\n' "$1" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
    }

    save_state() {
      kubectl patch configmap "${state}" --type merge \
        -p "{\"data\":{\"gid\":\"$1\",\"empty_since\":\"$2\"}}" >/dev/null
    }

    # Exactly one running pod, or a rollout is under way and nothing here
    # should act on a half-replaced server.
    selector=$(kubectl get deployment "${deploy}" -o json \
      | jq -r '.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")')
    pod=$(kubectl get pods -l "${selector}" -o json \
      | jq -r '[.items[] | select(.status.phase == "Running" and .metadata.deletionTimestamp == null)]
          | if length == 1 then .[0].metadata.name else empty end')
    if [ -z "${pod}" ]; then
      echo "no single running server pod; leaving it alone"
      exit 0
    fi

    started=$(kubectl get pod "${pod}" -o json | jq -r --arg c "${container}" \
      '.status.containerStatuses[] | select(.name == $c) | .state.running.startedAt // empty')
    uptime=0
    [ -z "${started}" ] || uptime=$((now - $(epoch "${started}")))

    # The whole log of the current process, because the registration line is
    # written once at start and a tail would lose it on a long-running server.
    kubectl logs "${pod}" -c "${container}" --timestamps > "${log}"

    # The last registration wins: an empty address at registration is filled
    # in later by a lobby update.
    registered=$(grep -E 'serverIP used to register the server: |Updating lobby with public IP ' "${log}" \
      | tail -1 | sed -E 's/.*(server: |public IP )//; s/:[0-9]+[[:space:]]*$//' || true)

    # Cloudflare's view of the egress address, as the ddns job uses. An outage
    # leaves it empty and the check is skipped rather than guessed.
    current=$(curl -4 -fsS --max-time 10 https://cloudflare.com/cdn-cgi/trace 2>/dev/null \
      | sed -n 's/^ip=//p' || true)

    # The connection count from the server's periodic stats line. The PlayFab
    # player count is not used: it drifts and was seen reporting a player on
    # an empty server. A missing or stale line means unknown.
    online=""
    count_line=$(grep -E ' Connections [0-9]+ ZDOS:' "${log}" | tail -1 || true)
    if [ -n "${count_line}" ]; then
      count_age=$((now - $(epoch "${count_line%% *}")))
      if [ "${count_age}" -le "${max_count_age}" ]; then
        online=$(printf '%s\n' "${count_line}" | sed -E 's/.* Connections ([0-9]+) ZDOS:.*/\1/')
      fi
    fi

    remote=$(curl -fsS --retry 3 "https://api.steamcmd.net/v1/info/${steam_app}" 2>/dev/null \
      | jq -r --arg a "${steam_app}" --arg d "${steam_depot}" \
          '.data[$a].depots[$d].manifests.public.gid // empty' || true)
    case "${remote}" in '' | *[!0-9]*) remote="" ;; esac

    known=$(kubectl get configmap "${state}" -o jsonpath='{.data.gid}')
    empty_since=$(kubectl get configmap "${state}" -o jsonpath='{.data.empty_since}')
    case "${empty_since}" in *[!0-9]*) empty_since="" ;; esac

    # Unknown counts as occupied. Guessing empty is how players get dropped
    # without warning, and the daily backstop bounds how long that can last.
    if [ "${online}" = "0" ]; then
      [ -n "${empty_since}" ] || empty_since=${now}
    else
      empty_since=""
    fi

    # First run adopts what is deployed rather than restarting a server that
    # is almost certainly already current.
    if [ -z "${known}" ] && [ -n "${remote}" ]; then
      known=${remote}
      echo "recorded initial manifest ${remote}"
    fi

    reason=""
    status="no restart needed: manifest=${known:-unknown} address=${registered:-unknown} connections=${online:-unknown}"
    if is_ipv4 "${registered}" && is_ipv4 "${current}" && [ "${registered}" != "${current}" ]; then
      reason="registered address ${registered} is no longer the WAN address ${current}"
    elif [ -n "${remote}" ] && [ "${remote}" != "${known}" ]; then
      empty_for=0
      [ -z "${empty_since}" ] || empty_for=$((now - empty_since))
      if [ "${force}" = "true" ]; then
        reason="manifest moved ${known} to ${remote}; forced"
      elif [ -n "${empty_since}" ] && [ "${empty_for}" -ge "${min_empty}" ]; then
        reason="manifest moved ${known} to ${remote}; empty for ${empty_for}s"
      else
        status="update ${remote} pending, holding: connections=${online:-unknown} empty_for=${empty_for}s/${min_empty}s"
      fi
    fi

    if [ -n "${reason}" ] && [ "${uptime}" -lt "${min_uptime}" ]; then
      status="holding until ${min_uptime}s uptime (${uptime}s): ${reason}"
      reason=""
    fi

    if [ -z "${reason}" ]; then
      save_state "${known}" "${empty_since}"
      echo "${status}"
      exit 0
    fi

    echo "restarting: ${reason}"
    kubectl rollout restart "deployment/${deploy}"
    kubectl rollout status "deployment/${deploy}" --timeout=15m

    # Any restart installs the current build, so it is recorded whichever
    # reason triggered it. Recorded only after a successful rollout, so a
    # failed restart is retried on the next run rather than being marked done.
    save_state "${remote:-${known}}" ""
    echo "restarted"
