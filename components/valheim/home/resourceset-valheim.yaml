---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/refs/heads/main/schema/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: valheim
  namespace: valheim
spec:
  # One entry per world. The name is the world, the server and the restic
  # repository, because all three are one to one and the save file pins the
  # name: changing it does not rename a world, it starts a new empty one.
  #
  # The port is per world because that is what distinguishes servers sharing a
  # public address. It has to be reachable: the server is unlisted, so players
  # join by address, and the world occupies this port and the one above it.
  #
  # Everything else is generated. Adding a world is an entry here plus a
  # credential item holding its password.
  inputs:
    - name: "borgheim"
      port: "2456"
      credentialsItem: "uzjdzszpgjth543epmhdjbx33q"

  resources:
    # Each world's updater can touch only its own deployment and its own
    # state, so one world cannot restart another.
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: valheim-<< inputs.name >>-updater
        namespace: valheim

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: valheim-<< inputs.name >>-updater
        namespace: valheim
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get"]
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["get", "list", "watch", "patch"]
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["create"]
        - apiGroups: [""]
          resources: ["configmaps"]
          resourceNames: ["valheim-<< inputs.name >>-updater-state"]
          verbs: ["get", "update", "patch"]

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: valheim-<< inputs.name >>-updater
        namespace: valheim
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: valheim-<< inputs.name >>-updater
      subjects:
        - kind: ServiceAccount
          name: valheim-<< inputs.name >>-updater
          namespace: valheim

    - apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: valheim-<< inputs.name >>-credentials
        namespace: valheim
      spec:
        # Only the password is secret. The world name is an identifier, not a
        # credential, and it names the resources and the backup repository.
        itemPath: "vaults/4kbytax7eoweefgrkbg2af6oxu/items/<< inputs.credentialsItem >>"

    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: valheim-<< inputs.name >>-server-pvc
        namespace: valheim
        annotations:
          # Game files and the Steamworks redistributable are re-downloaded on
          # any start, so backing them up stores nothing that cannot be fetched
          # again.
          k8up.io/backup: "false"
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        storageClassName: longhorn

    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: valheim-<< inputs.name >>-worlds-pvc
        namespace: valheim
        labels:
          k8up.io/backup-schedule: valheim-<< inputs.name >>-worlds
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
        storageClassName: longhorn

    - apiVersion: k8up.io/v1
      kind: Schedule
      metadata:
        name: valheim-<< inputs.name >>-worlds
        namespace: valheim
      spec:
        podSecurityContext:
          runAsUser: 10001
          runAsGroup: 10001
          fsGroup: 10001
        backup:
          # Away from the evening, when a torn newest save is most likely.
          # Valheim writes a numbered save then an .ok marker, so an incomplete
          # newest file still leaves the previous complete pair.
          schedule: "20 4,16 * * *"
          clusterName: valheim-<< inputs.name >>-worlds
          failedJobsHistoryLimit: 3
          successfulJobsHistoryLimit: 3
          podConfigRef:
            name: backup-exclude-lost-found
          labelSelectors:
            - matchLabels:
                k8up.io/backup-schedule: valheim-<< inputs.name >>-worlds
        prune:
          schedule: "40 3 * * 6"
          retention:
            keepHourly: 4
            keepDaily: 7
            keepWeekly: 4
            keepMonthly: 3
        check:
          schedule: "55 3 * * 6"
          clusterName: valheim-<< inputs.name >>-worlds
        backend:
          repoPasswordSecretRef:
            name: ovhcloud-k8up-home-s3
            key: RESTIC_PASSWORD
          s3:
            endpoint: https://s3.de.io.cloud.ovh.net
            bucket: k8up-home-a58c5097c4/valheim/<< inputs.name >>
            accessKeyIDSecretRef:
              name: ovhcloud-k8up-home-s3
              key: AWS_ACCESS_KEY_ID
            secretAccessKeySecretRef:
              name: ovhcloud-k8up-home-s3
              key: AWS_SECRET_ACCESS_KEY

    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: valheim-<< inputs.name >>
        namespace: valheim
      spec:
        interval: 1h
        chartRef:
          kind: OCIRepository
          name: app-template
          namespace: bjw-s
        values:
          controllers:
            valheim-<< inputs.name >>:
              # One world on one ReadWriteOnce volume. Two servers opening the
              # same world would corrupt it, so the old pod must be gone before
              # the new one starts.
              strategy: Recreate
              pod:
                securityContext:
                  runAsUser: 10001
                  runAsGroup: 10001
                  runAsNonRoot: true
                  fsGroup: 10001
                  # FEX resolves guest paths with openat2 and RESOLVE_IN_ROOT,
                  # falling back to the host path, so this profile has to permit
                  # openat2. Verified under emulation before being set.
                  seccompProfile:
                    type: RuntimeDefault
                # The world is written on shutdown, and cutting that short is
                # how worlds get damaged.
                terminationGracePeriodSeconds: 300
              containers:
                app:
                  image:
                    repository: ghcr.io/bendwyer/containers/valheim-server
                    tag: "1.0.2@sha256:d1db707b7d238ad5aff534c0fbab44c9217a3533c78d59ef2f47e3f0773066b8"
                    pullPolicy: IfNotPresent
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]
                  env:
                    TZ: Europe/Berlin
                    VALHEIM_PUBLIC: "0"
                    VALHEIM_CROSSPLAY: "true"
                    VALHEIM_PORT: << inputs.port | quote >>
                    # One value for both. The server serves exactly one world,
                    # and the save file pins the name, so these cannot
                    # meaningfully differ.
                    VALHEIM_SERVER_NAME: << inputs.name | quote >>
                    VALHEIM_WORLD: << inputs.name | quote >>
                    VALHEIM_PASSWORD:
                      valueFrom:
                        secretKeyRef:
                          name: valheim-<< inputs.name >>-credentials
                          key: password
                  resources:
                    requests:
                      cpu: "1"
                      memory: 8Gi
                    limits:
                      memory: 8Gi
                  # Valheim listens on UDP only and serves no health endpoint,
                  # so the chart's default TCP probes would fail a healthy
                  # server.
                  probes:
                    liveness:
                      enabled: false
                    readiness:
                      enabled: false
                    startup:
                      enabled: false
          # A LoadBalancer rather than a hostPort, because the router forwards to
          # a fixed address and a hostPort moves with the pod. Every world shares
          # one address: there is a single WAN address behind it, so the external
          # port is what has to differ, and a second address would buy nothing
          # while consuming a pool of five.
          #
          # Local preserves the client address. Cluster would replace it with a
          # node address, and the server would see every player as one host.
          service:
            game:
              controller: valheim-<< inputs.name >>
              type: LoadBalancer
              externalTrafficPolicy: Local
              annotations:
                metallb.io/loadBalancerIPs: "192.168.10.47"
                # Worlds differ by port on this one address, which MetalLB only
                # permits when each of them agrees to the sharing key.
                metallb.io/allow-shared-ip: "valheim"
              ports:
                game:
                  port: << inputs.port | int >>
                  protocol: UDP
                # Valheim opens the Steam query port at game port plus one.
                # Derived rather than configured so the pair cannot drift.
                query:
                  port: << add (inputs.port | int) 1 >>
                  protocol: UDP
          persistence:
            server:
              enabled: true
              existingClaim: valheim-<< inputs.name >>-server-pvc
              globalMounts:
                - path: /data
            worlds:
              enabled: true
              existingClaim: valheim-<< inputs.name >>-worlds-pvc
              globalMounts:
                - path: /data/worlds

    - apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: valheim-<< inputs.name >>-updater
        namespace: valheim
      spec:
        # Bounds how long the server can sit on an older build than the
        # clients, which is the window in which nobody can join.
        schedule: "*/15 * * * *"
        timeZone: "Etc/UTC"
        concurrencyPolicy: Forbid
        successfulJobsHistoryLimit: 3
        failedJobsHistoryLimit: 3
        startingDeadlineSeconds: 300
        jobTemplate:
          spec:
            backoffLimit: 1
            activeDeadlineSeconds: 1200
            template:
              spec:
                restartPolicy: Never
                serviceAccountName: valheim-<< inputs.name >>-updater
                securityContext:
                  runAsUser: 10001
                  runAsGroup: 10001
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: updater
                    image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
                    command: ["/bin/sh", "/scripts/update.sh"]
                    env:
                      - name: VALHEIM_DEPLOYMENT
                        value: valheim-<< inputs.name >>
                      - name: STATE_CONFIGMAP
                        value: valheim-<< inputs.name >>-updater-state
                      - name: MIN_EMPTY_CHECKS
                        value: "2"
                    resources:
                      requests:
                        cpu: 10m
                        memory: 64Mi
                      limits:
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - name: scripts
                        mountPath: /scripts
                      - name: tmp
                        mountPath: /tmp
                volumes:
                  - name: scripts
                    configMap:
                      name: valheim-updater
                  - name: tmp
                    emptyDir: {}

    # The deadlock breaker. A server that is never empty would otherwise hold a
    # stale build indefinitely, and the players keeping it occupied are exactly
    # the ones unaffected, because their clients have not updated either.
    #
    # 12:00 UTC is the only real trough for a mixed US and EU playerbase: EU
    # afternoon, US east coast early morning, US west coast asleep. Pinned to
    # UTC because the two regions change DST on different dates. It still only
    # restarts when a build is pending, so a day with no update does nothing.
    - apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: valheim-<< inputs.name >>-updater-daily
        namespace: valheim
      spec:
        # Offset from the quarter hour so it never races the frequent check.
        schedule: "7 12 * * *"
        timeZone: "Etc/UTC"
        concurrencyPolicy: Forbid
        successfulJobsHistoryLimit: 3
        failedJobsHistoryLimit: 3
        startingDeadlineSeconds: 300
        jobTemplate:
          spec:
            backoffLimit: 1
            activeDeadlineSeconds: 1200
            template:
              spec:
                restartPolicy: Never
                serviceAccountName: valheim-<< inputs.name >>-updater
                securityContext:
                  runAsUser: 10001
                  runAsGroup: 10001
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: updater
                    image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
                    command: ["/bin/sh", "/scripts/update.sh"]
                    env:
                      - name: VALHEIM_DEPLOYMENT
                        value: valheim-<< inputs.name >>
                      - name: STATE_CONFIGMAP
                        value: valheim-<< inputs.name >>-updater-state
                      - name: FORCE_RESTART
                        value: "true"
                    resources:
                      requests:
                        cpu: 10m
                        memory: 64Mi
                      limits:
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - name: scripts
                        mountPath: /scripts
                      - name: tmp
                        mountPath: /tmp
                volumes:
                  - name: scripts
                    configMap:
                      name: valheim-updater
                  - name: tmp
                    emptyDir: {}
