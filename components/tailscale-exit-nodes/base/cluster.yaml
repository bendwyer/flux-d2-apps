---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/refs/heads/main/schema/postgresql.cnpg.io/cluster_v1.json
# CloudNativePG ledger for the exit-node deployments table. CNPG auto-creates
# Secret tailscale-exit-nodes-db-app (key uri) consumed as DATABASE_URL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tailscale-exit-nodes-db
  namespace: tailscale-exit-nodes
spec:
  # Three instances on single-replica volumes hold the same three copies of the
  # data as one instance on the default three-replica class, but a node drain
  # becomes a switchover rather than downtime.
  instances: 3
  # required, not the defaulted preferred: with one copy per volume, two
  # instances sharing a node would put two of the three copies on one disk.
  affinity:
    podAntiAffinityType: required
  # Talos's drain timeout is a hardcoded 300s.
  stopDelay: 120 # default 1800
  smartShutdownTimeout: 30 # default 180
  storage:
    storageClass: longhorn-single
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 256Mi
  bootstrap:
    initdb:
      database: exitnodes
      owner: exitnodes
